# Naiad matrix-unit encodings: the attached (AME) instructions in custom-0 / custom-1.
#
# This table is the single source of truth. framework/matrix/encodings.py builds
# the decoder from it at import, and the Naiad header generator emits the
# opcode, funct3, format codes and field shifts below as #defines, which
# kernels/naiad/include/matrix.h assembles with .insn. An encoding can therefore
# move without a code change. It is loosely shaped after the RISC-V AME
# proposals (tile registers, accumulators, format fields), but it is our own.
#
# Every instruction is a 32-bit R-type (.insn r opcode, funct3, funct7, rd, rs1,
# rs2) or I-type (.insn i opcode, funct3, rd, rs1, imm12) word. An operand
# either names a standard field (rd, rs1, rs2, imm) or gives its bit range
# [lo, hi] inside funct7 (R-type, bits 25-31) or imm (I-type, bits 20-31).
# Any bit not covered by the opcode, funct3 or an operand is reserved and must
# be zero; a word with a reserved bit set is an illegal instruction.
#
# Operand kinds:
#   tile     an input tile register index (a literal in a register field)
#   acc      an accumulator index (likewise)
#   gpr      an x-register
#   in_fmt   an input-format code (see formats); must be one the design lists
#   acc_fmt  an accumulator-format code; must be one the design lists
#   flag     a one-bit modifier
#   config   an mcfg selector (see config)
#   uimm     an unsigned immediate (its meaning is the instruction's)
#
# An instruction or flag with a `feature` is optional: it is illegal unless the
# design lists that feature (a flag only when it is set).
#
# Shapes: the unit is M x N x K. An "a" tile is M x K, a "b" tile K x N, an
# accumulator M x N. Tiles and accumulators hold raw bit patterns; the format
# field of the instruction that reads them says what the bits mean, exactly as
# a hardware register file would. Rows are contiguous in memory; rs2 is the
# byte stride from one row to the next.
#
# Overlap with other custom-space matrix ISAs (documentation only: Naiad builds
# one design per binary, so no Naiad hart decodes two tables). The RISC-V AME
# draft Ztt v0.6 (riscv/riscv-attached-matrix-extension, tag v0.6, 8d27acdc,
# 2026-08-16; INSTRUCTION_ENCODINGS.md) puts all 138 of its instructions in
# custom-1 (0x2B) with funct3 = 000, selected by funct7 0x00-0x63. That is
# exactly where our mma sits, with its formats in funct7, so every mma word is
# also a Ztt word: mma fp32/fp32 (funct7 0x11) decodes in Ztt as
# mmulaccneg.ew.x. The SpacemiT XSMTVDot (smt.vmadot*: custom-1, bit 31 set,
# funct3 = signedness) and T-Head matrix (custom-1) tables overlap our custom-1
# funct3 1-5 as well. The existing words keep their encodings (renumbering
# would change every built kernel's meaning). The instructions added to track
# Ztt's capabilities (amov, tconv, mma.at/.bt, treduce, tprefix) and the
# proposed tshift2 all live in custom-2 (0x5B), which none of those three
# tables uses, so they stay clear of Ztt's slots. Their mnemonics and operands
# are ours: Ztt types its operands through datatype registers (Md/Ad), while
# our formats stay in the instruction.

opcodes:
  custom-0: 0x0B
  custom-1: 0x2B
  custom-2: 0x5B
  custom-3: 0x7B

# Format codes (names from framework/matrix/formats.py). mma's acc_fmt field is
# three bits wide, so only codes 0-7 can be accumulator formats.
formats:
  fp64: 0
  fp32: 1
  fp16: 2
  bf16: 3
  int32: 4
  tf32: 5
  fp8_e4m3: 6
  fp8_e5m2: 7
  int8: 8

# Optional features and their bit in mcfg's FEATURES word.
features:
  transpose: 0  # transposed tile loads (tload.* with t=1)
  shift: 1      # tshift
  epilogue: 2   # ascal / aadds
  semiring: 3   # mma.minplus / mma.maxplus
  # aload / astore. On unless the design says matrix.acc_mem: false: Ztt has
  # no memory <-> accumulator path, so a Ztt-like unit moves acc -> tile -> memory.
  acc_mem: 4
  acc_move: 5       # amov.t.a / amov.a.t  (Ztt mmov.m.a / mmov.a.m)
  convert: 6        # tconv                (Ztt mconv.ew)
  mma_transpose: 7  # mma.at / mma.bt      (Ztt mmulatacc.2d / mmulbtacc.2d)
  reduce: 8         # treduce / tprefix    (Ztt mreduce{add,max,min}.{row,col}, mprefix{add,max}.{row,col})
  shift2: 9         # tshift2: NOT in Ztt, a candidate feature this study proposes
  # The epilogue-fusion study's proposals (custom-3). Ztt v0.6 has the same
  # arithmetic, but on M registers (madd/msub/mmul/mmax/mmin/mmuladd .ew and
  # .ew.x, mrsqrt.ew): these act on the accumulators in place.
  ewise: 10         # aew.aa / aew.at / aew.ax / amacc.aa / amacc.at
  ewise_tx: 11      # aewu: recip / rsqrt / sqrt (Ztt: mrsqrt.ew only)
  halo: 12          # tloadh: NOT in Ztt, a candidate feature this study proposes (custom-3 funct3 6)

# mcfg selectors.
config:
  M: 0
  N: 1
  K: 2
  TILES: 3        # number of input tile registers
  ACCS: 4         # number of accumulators
  IN_FORMATS: 5   # bit (1 << code) for each implemented input format
  ACC_FORMATS: 6  # bit (1 << code) for each implemented accumulator format
  FEATURES: 7     # bit (1 << feature bit) for each implemented feature

instructions:
  # -- custom-0: data movement -------------------------------------------------
  tload.a:
    opcode: custom-0
    form: r
    funct3: 0
    exec: tile_load
    params: {role: a}
    operands:
      td: {field: rd, kind: tile}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: in_fmt}
      t: {bits: [29, 29], kind: flag, feature: transpose}
    doc: >
      Load tile td as an "a" operand: M rows of K fmt elements, row r at
      x[base] + r * x[stride]. With t=1 memory holds the K x M transpose
      (K rows of M elements) and td receives its transpose. Bytes of td
      outside the loaded shape become zero.

  tload.b:
    opcode: custom-0
    form: r
    funct3: 1
    exec: tile_load
    params: {role: b}
    operands:
      td: {field: rd, kind: tile}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: in_fmt}
      t: {bits: [29, 29], kind: flag, feature: transpose}
    doc: >
      Load tile td as a "b" operand: K rows of N fmt elements (with t=1, N
      rows of K elements, transposed on the way in). Otherwise as tload.a.

  tstore.a:
    opcode: custom-0
    form: r
    funct3: 2
    exec: tile_store
    params: {role: a}
    operands:
      ts: {field: rd, kind: tile}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: in_fmt}
    doc: >
      Store tile ts's M x K "a" view, fmt elements, row r to
      x[base] + r * x[stride].

  tstore.b:
    opcode: custom-0
    form: r
    funct3: 3
    exec: tile_store
    params: {role: b}
    operands:
      ts: {field: rd, kind: tile}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: in_fmt}
    doc: Store tile ts's K x N "b" view, as tstore.a.

  aload:
    opcode: custom-0
    form: r
    funct3: 4
    exec: acc_load
    feature: acc_mem
    operands:
      ad: {field: rd, kind: acc}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: acc_fmt}
    doc: >
      Load accumulator ad: M rows of N fmt elements, row r at
      x[base] + r * x[stride].

  astore:
    opcode: custom-0
    form: r
    funct3: 5
    exec: acc_store
    feature: acc_mem
    operands:
      as: {field: rd, kind: acc}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: acc_fmt}
    doc: Store accumulator as (M x N fmt elements), as aload.

  azero:
    opcode: custom-0
    form: r
    funct3: 6
    exec: acc_zero
    operands:
      ad: {field: rd, kind: acc}
    doc: Set every bit of accumulator ad to zero (0.0 in every float format, 0 in int32).

  tshift:
    opcode: custom-0
    form: r
    funct3: 7
    exec: tile_shift
    feature: shift
    operands:
      td: {field: rd, kind: tile}
      ts: {field: rs1, kind: tile}
      amount: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: in_fmt}
      cols: {bits: [29, 29], kind: flag}
      b: {bits: [30, 30], kind: flag}
    doc: >
      td = ts shifted by the signed x[amount] along rows (cols=0) or columns
      (cols=1) of its "a" view (b=0, M x K) or "b" view (b=1, K x N), with fmt
      elements: td[i] = ts[i - amount], zero where i - amount is out of range.
      td may be ts.

  # -- custom-1: compute and configuration -------------------------------------
  mma:
    opcode: custom-1
    form: r
    funct3: 0
    exec: mma
    params: {semiring: plus_times}
    operands:
      ad: {field: rd, kind: acc}
      ta: {field: rs1, kind: tile}
      tb: {field: rs2, kind: tile}
      in: {bits: [25, 28], kind: in_fmt}
      acc: {bits: [29, 31], kind: acc_fmt}
    doc: >
      acc[ad] = acc[ad] + tile[ta] x tile[tb]: ta's M x K "a" view times tb's
      K x N "b" view, both read as the in format, accumulated in the acc
      format (framework.matrix.mac.tile_mac). Float formats pair with float
      formats; int8/int32 inputs accumulate in int32 with wraparound.

  mma.minplus:
    opcode: custom-1
    form: r
    funct3: 1
    exec: mma
    feature: semiring
    params: {semiring: min_plus}
    operands:
      ad: {field: rd, kind: acc}
      ta: {field: rs1, kind: tile}
      tb: {field: rs2, kind: tile}
      in: {bits: [25, 28], kind: in_fmt}
      acc: {bits: [29, 31], kind: acc_fmt}
    doc: acc[ad][i, j] = min(acc[ad][i, j], min_k ta[i, k] + tb[k, j]).

  mma.maxplus:
    opcode: custom-1
    form: r
    funct3: 2
    exec: mma
    feature: semiring
    params: {semiring: max_plus}
    operands:
      ad: {field: rd, kind: acc}
      ta: {field: rs1, kind: tile}
      tb: {field: rs2, kind: tile}
      in: {bits: [25, 28], kind: in_fmt}
      acc: {bits: [29, 31], kind: acc_fmt}
    doc: acc[ad][i, j] = max(acc[ad][i, j], max_k ta[i, k] + tb[k, j]).

  mcfg:
    opcode: custom-1
    form: i
    funct3: 3
    exec: config_read
    operands:
      rd: {field: rd, kind: gpr}
      sel: {field: imm, kind: config}
    doc: >
      x[rd] = the configuration word sel names (see config), so a kernel can
      be shape- and format-generic. An unknown selector is illegal.

  ascal:
    opcode: custom-1
    form: r
    funct3: 4
    exec: acc_scalar
    feature: epilogue
    params: {op: mul}
    operands:
      ad: {field: rd, kind: acc}
      value: {field: rs1, kind: gpr}
      fmt: {bits: [25, 28], kind: acc_fmt}
    doc: >
      acc[ad] = acc[ad] * s, element-wise, where s is the low bits of
      x[value] read as one fmt element (e.g. an fp32 bit pattern), rounded
      once to fmt.

  aadds:
    opcode: custom-1
    form: r
    funct3: 5
    exec: acc_scalar
    feature: epilogue
    params: {op: add}
    operands:
      ad: {field: rd, kind: acc}
      value: {field: rs1, kind: gpr}
      fmt: {bits: [25, 28], kind: acc_fmt}
    doc: acc[ad] = acc[ad] + s, element-wise, as ascal.

  # -- custom-2: the Ztt-tracking additions, and one proposal -------------------
  # Each mirrors a Ztt v0.6 capability (named in its doc: the instruction pages
  # of the draft's src/instructions.adoc), with our operand conventions: tile
  # and accumulator indices as literals, formats in the instruction.
  amov.t.a:
    opcode: custom-2
    form: r
    funct3: 0
    exec: acc_to_tile
    feature: acc_move
    operands:
      td: {field: rd, kind: tile}
      as: {field: rs1, kind: acc}
      fmt: {bits: [25, 28], kind: acc_fmt}
      b: {bits: [29, 29], kind: flag}
    doc: >
      Tile td's "a" view (b=0) or "b" view (b=1) = accumulator as, fmt
      elements, bit for bit (Ztt mmov.m.a, whose source and destination
      datatypes must match). fmt must be both an accumulator and an input
      format, and the view must be M x N (K = N for b=0, K = M for b=1).
      Bytes of td outside the view become zero.

  amov.a.t:
    opcode: custom-2
    form: r
    funct3: 1
    exec: tile_to_acc
    feature: acc_move
    operands:
      ad: {field: rd, kind: acc}
      ts: {field: rs1, kind: tile}
      fmt: {bits: [25, 28], kind: acc_fmt}
      b: {bits: [29, 29], kind: flag}
    doc: >
      Accumulator ad = tile ts's "a" (b=0) or "b" (b=1) view, fmt elements,
      bit for bit (Ztt mmov.a.m); the converse of amov.t.a, with its conditions.

  tconv:
    opcode: custom-2
    form: r
    funct3: 2
    exec: tile_convert
    feature: convert
    operands:
      td: {field: rd, kind: tile}
      ts: {field: rs1, kind: tile}
      to: {field: rs2, kind: in_fmt}
      from: {bits: [25, 28], kind: in_fmt}
      b: {bits: [29, 29], kind: flag}
    doc: >
      Tile td's view (a or b, as b says) = tile ts's view read as `from`,
      converted element by element to `to` with one round to nearest even
      (Ztt mconv.ew, where the destination datatype picks the rounding;
      Naiad formats always round RNE). Float to float, or int to int
      (wrapping); float <-> int is illegal. td may be ts; bytes of td outside
      the view become zero. After an amov.t.a this is the accumulator ->
      narrower tile path (fp32 acc -> bf16/fp16 tile) Ztt has instead of a
      converting store.

  mma.at:
    opcode: custom-2
    form: r
    funct3: 3
    exec: mma
    feature: mma_transpose
    params: {semiring: plus_times, transpose: a}
    operands:
      ad: {field: rd, kind: acc}
      ta: {field: rs1, kind: tile}
      tb: {field: rs2, kind: tile}
      in: {bits: [25, 28], kind: in_fmt}
      acc: {bits: [29, 31], kind: acc_fmt}
    doc: >
      acc[ad] = acc[ad] + A' x tile[tb], where A is the K x M block at the top
      left of tile ta (rows 0..K-1 of M elements; for a square unit, ta's "a"
      view) and tb is read as its "b" view (Ztt mmulatacc.2d,
      C[i,j] += sum_q A[q,i] B[q,j]). Needs M <= max(K, N), so the block fits.

  mma.bt:
    opcode: custom-2
    form: r
    funct3: 4
    exec: mma
    feature: mma_transpose
    params: {semiring: plus_times, transpose: b}
    operands:
      ad: {field: rd, kind: acc}
      ta: {field: rs1, kind: tile}
      tb: {field: rs2, kind: tile}
      in: {bits: [25, 28], kind: in_fmt}
      acc: {bits: [29, 31], kind: acc_fmt}
    doc: >
      acc[ad] = acc[ad] + tile[ta] x B', where B is the N x K block at the top
      left of tile tb (Ztt mmulbtacc.2d, C[i,j] += sum_q A[i,q] B[j,q]). Needs
      N <= max(M, K).

  treduce:
    opcode: custom-2
    form: r
    funct3: 5
    exec: tile_reduce
    feature: reduce
    params: {prefix: false}
    operands:
      td: {field: rd, kind: tile}
      ts: {field: rs1, kind: tile}
      op: {field: rs2, kind: uimm}
      fmt: {bits: [25, 28], kind: in_fmt}
      cols: {bits: [29, 29], kind: flag}
      b: {bits: [30, 30], kind: flag}
    doc: >
      Reduce each row (cols=0, Ztt mreduce*.row) or each column (cols=1,
      mreduce*.col) of ts's view, broadcasting the result along it in td:
      op 0 = add (mreduceadd), 1 = max (mreducemax), 2 = min (mreducemin);
      other values are illegal. Adds fold in increasing index order, each
      rounded to fmt (one of the association trees Ztt allows). td may be ts;
      bytes of td outside the view become zero.

  tprefix:
    opcode: custom-2
    form: r
    funct3: 6
    exec: tile_reduce
    feature: reduce
    params: {prefix: true}
    operands:
      td: {field: rd, kind: tile}
      ts: {field: rs1, kind: tile}
      op: {field: rs2, kind: uimm}
      fmt: {bits: [25, 28], kind: in_fmt}
      cols: {bits: [29, 29], kind: flag}
      b: {bits: [30, 30], kind: flag}
    doc: >
      Inclusive prefix along each row (cols=0, Ztt mprefix*.row) or column
      (cols=1, mprefix*.col) of ts's view into td: op 0 = add (mprefixadd),
      1 = max (mprefixmax); other values are illegal. Sequential, each step
      rounded to fmt. td may be ts; bytes of td outside the view become zero.

  tshift2:
    opcode: custom-2
    form: r
    funct3: 7
    exec: tile_shift2
    feature: shift2
    operands:
      td: {field: rd, kind: tile}
      ta: {field: rs1, kind: tile}
      tb: {field: rs2, kind: tile}
      esz: {bits: [25, 26], kind: uimm}
      cols: {bits: [27, 27], kind: flag}
      amount: {bits: [28, 31], kind: uimm}
    doc: >
      NOT IN ZTT: a tile funnel shift this study proposes (Ztt's mrowshift /
      mcolshift fill with zeros). Needs a square unit, M = N = K = R. With ta
      stacked above tb (cols=0) or ta left of tb (cols=1), td = the R x R
      window starting `amount` rows (columns) in: td[i] = (ta ++ tb)[i + amount],
      so td's last `amount` rows (columns) are tb's first ones. Elements are
      2^esz bytes, no wider than the widest input format; amount is 0 to
      min(R, 15). td may be ta or tb; bytes of td outside the window become
      zero.

  # -- custom-3: element-wise accumulator ops (the epilogue-fusion study) --------
  #
  # Element-wise arithmetic on accumulators in place, so a matrix kernel's
  # element-wise phase (a twiddle multiply, a clamp, a reciprocal square root)
  # never leaves the unit. The second operand is another accumulator (.aa), a
  # tile (.at: the tile's top-left M x N block read as fmt elements, i.e. its
  # "a" view when K = N, which is what tload.a of an M x N block of fmt leaves:
  # the twiddle / bias / residual operand from memory) or a scalar (.ax: the
  # low bits of x[rs2] read as one fmt element, Ztt's .ew.x forms).
  #
  # Numerics, bit-defined: fmt must be a float accumulator format (int32 is
  # illegal). Every op is computed exactly and rounded once to fmt, round to
  # nearest even (fp32 and narrower: in fp64, exact for a product and correctly
  # rounded for a sum since 53 >= 2p + 2, the fused forms through TwoSum and a
  # sticky bit; fp64: native, the fused forms exactly). max / min are IEEE
  # 754-2019 maximum / minimum (a NaN operand gives NaN; -0 < +0). Status flags
  # are not modelled. Timing: each op streams M x N fmt elements through an
  # element-wise datapath at timing.matrix.ewise_bytes_per_cycle, on its own
  # pipe by default (framework/matrix/timing.py).
  aew.aa:
    opcode: custom-3
    form: r
    funct3: 0
    exec: acc_ewise
    feature: ewise
    params: {src: acc}
    operands:
      ad: {field: rd, kind: acc}
      as1: {field: rs1, kind: acc}
      as2: {field: rs2, kind: acc}
      fmt: {bits: [25, 28], kind: acc_fmt}
      op: {bits: [29, 31], kind: uimm}
    doc: >
      acc[ad] = acc[as1] op acc[as2], element-wise, rounded once to fmt: op 0 =
      add, 1 = sub (as1 - as2), 2 = mul, 3 = max, 4 = min, 5 = rsub (as2 - as1);
      6 and 7 are illegal. ad may be as1 or as2 (Ztt madd/msub/mmul/mmax/mmin.ew,
      on accumulators instead of M registers).

  aew.at:
    opcode: custom-3
    form: r
    funct3: 1
    exec: acc_ewise
    feature: ewise
    params: {src: tile}
    operands:
      ad: {field: rd, kind: acc}
      as1: {field: rs1, kind: acc}
      ts: {field: rs2, kind: tile}
      fmt: {bits: [25, 28], kind: acc_fmt}
      op: {bits: [29, 31], kind: uimm}
    doc: >
      acc[ad] = acc[as1] op T, as aew.aa, where T is tile ts's top-left M x N
      block of fmt elements (the "a" view when K = N). The M x N block of fmt
      elements must fit the tile storage.

  aew.ax:
    opcode: custom-3
    form: r
    funct3: 2
    exec: acc_ewise
    feature: ewise
    params: {src: scalar}
    operands:
      ad: {field: rd, kind: acc}
      as1: {field: rs1, kind: acc}
      value: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: acc_fmt}
      op: {bits: [29, 31], kind: uimm}
    doc: >
      acc[ad] = acc[as1] op s, as aew.aa, where s is the low bits of x[value]
      read as one fmt element (Ztt's .ew.x forms; x0 gives +0.0, so op 3 is a
      clamp at zero).

  amacc.aa:
    opcode: custom-3
    form: r
    funct3: 3
    exec: acc_fma
    feature: ewise
    params: {src: acc}
    operands:
      ad: {field: rd, kind: acc}
      as1: {field: rs1, kind: acc}
      as2: {field: rs2, kind: acc}
      fmt: {bits: [25, 28], kind: acc_fmt}
      neg: {bits: [29, 29], kind: flag}
    doc: >
      acc[ad] = acc[ad] + acc[as1] * acc[as2] (neg = 0) or acc[ad] - acc[as1] *
      acc[as2] (neg = 1), element-wise and fused: rounded once to fmt (Ztt
      mmuladd.ew leaves fused or unfused to the implementation; here fused).

  amacc.at:
    opcode: custom-3
    form: r
    funct3: 4
    exec: acc_fma
    feature: ewise
    params: {src: tile}
    operands:
      ad: {field: rd, kind: acc}
      as1: {field: rs1, kind: acc}
      ts: {field: rs2, kind: tile}
      fmt: {bits: [25, 28], kind: acc_fmt}
      neg: {bits: [29, 29], kind: flag}
    doc: >
      acc[ad] = acc[ad] +/- acc[as1] * T, fused, with T tile ts's M x N block as
      in aew.at.

  aewu:
    opcode: custom-3
    form: r
    funct3: 5
    exec: acc_unary
    feature: ewise_tx
    operands:
      ad: {field: rd, kind: acc}
      as1: {field: rs1, kind: acc}
      fmt: {bits: [25, 28], kind: acc_fmt}
      op: {bits: [29, 31], kind: uimm}
    doc: >
      acc[ad] = f(acc[as1]), element-wise: op 0 = recip (1 / x), 1 = rsqrt
      (1 / sqrt(x)), 2 = sqrt; 3-7 are illegal. recip and sqrt are correctly
      rounded (RNE). rsqrt is RNE_fmt(RNE_64(1 / RNE_64(sqrt(x)))): for fp32 and
      narrower within 0.5 ulp + 2^-50 relative (correctly rounded unless the
      exact result is that close to a rounding boundary), for fp64 below 1.5 ulp.
      IEEE specials: recip(+-0) = +-inf, rsqrt(+0) = +inf, rsqrt(-0) = -inf,
      rsqrt / sqrt of x < 0 = NaN, rsqrt(+inf) = +0. Ztt mrsqrt.ew leaves its
      accuracy to the implementation.

  # The halo tile load: the radius-h generalisation of "one strided load plus a
  # tshift" that fuses a tile's vertical halo (tshift itself already takes any
  # signed amount from a register). Its encoding is custom-3 funct3 6, a slot
  # none of the other custom-3 words uses (the ewise ops take 0-5); funct3 7
  # stays free. NOT in Ztt.
  tloadh:
    opcode: custom-3
    form: r
    funct3: 6
    exec: tile_load_halo
    feature: halo
    operands:
      td: {field: rd, kind: tile}
      base: {field: rs1, kind: gpr}
      stride: {field: rs2, kind: gpr}
      fmt: {bits: [25, 28], kind: in_fmt}
      h: {bits: [29, 31], kind: uimm}
    doc: >
      NOT IN ZTT: a halo load this study proposes. Load tile td as a "b" operand
      (K rows of N fmt elements) holding only the h grid rows above and the h
      rows below a K-row block that starts at x[base], row r of the block at
      x[base] + r * x[stride]: td row i (0 <= i < h) = block row i - h (above),
      td row h + i (0 <= i < h) = block row K + i (below), the other rows
      zero. h is 1 to 7 and 2h must not exceed K (h = 0 is illegal). Where the
      strided tload.b + tshift pair reaches one row each side, this reaches h
      each side in one load, and it reads only those 2h rows.

# -- VME (Zvt) ------------------------------------------------------------------
#
# The vector-coupled mode's encodings: the VME TG's Zvt v0.4 (2026-08-31,
# "Zvt Family of Vector Matrix Extensions"), as committed to riscv-opcodes
# extensions/unratified/rv_zvt* in bf6a8a4 ("Add Zvt encodings (#429)",
# 2026-08-19). Unlike the AME table above these are the draft's own words, not
# custom-space ones: Zvt claims words RVV 1.0 leaves reserved (OP-V funct3 111
# with bit 31 set and bits 27:25 != 000; OPMVX funct6 010000 with vs2 != 0;
# OPMVX funct6 010111; LOAD-FP / STORE-FP width 111 with mew = 1) and the
# second vector major opcode, OP-VE. framework/matrix/vme.py reads this
# section (the AME decoder above ignores it); kernels/naiad/include/vme.h
# assembles the words with .insn from the NAIAD_VME_* defines it generates.
#
# Each instruction gives `fixed` bit ranges ("hi..lo": value, riscv-opcodes
# style; every bit an operand does not name is fixed) and its `operands`
# ([lo, hi] inside the word). `ext` is the draft extension that provides it.
# Where the PDF and riscv-opcodes differ, the PDF wins and the difference is
# noted (msetmtype[i] write no rd in the PDF; riscv-opcodes leaves rd free).
#
# Known collision (validated by framework/matrix/vme.py): vtle*/vtse* are
# bit-identical to Zvvm's vmtl.v / vmts.v (IME) with vd/vs3 = v0 and an
# immediate lambda, so a hart has IME or VME, never both.
vme:
  opcodes: {op-v: 0x57, load-fp: 0x07, store-fp: 0x27, op-ve: 0x77}
  instructions:
    msetmtypei:
      ext: Zvtbase
      fixed: {"31..29": 4, "27..25": 4, "22..20": 4, "19..17": 0, "14..12": 7, "11..7": 0, "6..0": 0x57}
      operands: {altfmt: [28, 28], vsew: [23, 24], mtwiden: [15, 16]}
    msetmtype:
      ext: Zvtbase
      fixed: {"31..29": 4, "28": 0, "27..25": 2, "14..12": 7, "11..7": 0, "6..0": 0x57}
      operands: {rs2: [20, 24], rs1: [15, 19]}
    msettn:
      ext: Zvtbase
      fixed: {"31..29": 4, "28": 0, "27..25": 4, "24..23": 0, "22..20": 0, "14..12": 7, "6..0": 0x57}
      operands: {rs1: [15, 19], rd: [7, 11]}
    msettm:
      ext: Zvtbase
      fixed: {"31..29": 4, "28": 0, "27..25": 4, "24..23": 0, "22..20": 1, "14..12": 7, "6..0": 0x57}
      operands: {rs1: [15, 19], rd: [7, 11]}
    msettk:
      ext: Zvtbase
      fixed: {"31..29": 4, "28": 0, "27..25": 4, "24..23": 0, "22..20": 2, "14..12": 7, "6..0": 0x57}
      operands: {rs1: [15, 19], rd: [7, 11]}
    vtle:
      ext: Zvtbase
      fixed: {"28..25": 0x9, "14..12": 7, "11..7": 0, "6..0": 0x07}
      operands: {eee: [29, 31], rs2: [20, 24], rs1: [15, 19]}
    vtse:
      ext: Zvtbase
      fixed: {"28..25": 0x9, "14..12": 7, "11..7": 0, "6..0": 0x27}
      operands: {eee: [29, 31], rs2: [20, 24], rs1: [15, 19]}
    vtmv.v.t:
      ext: Zvtbase
      fixed: {"31..26": 0x10, "25": 1, "24..20": 0x1F, "14..12": 6, "6..0": 0x57}
      operands: {rs1: [15, 19], vd: [7, 11]}
    vtmv.t.v:
      ext: Zvtbase
      fixed: {"31..26": 0x17, "25": 1, "14..12": 6, "11..7": 0, "6..0": 0x57}
      operands: {vs2: [20, 24], rs1: [15, 19]}
    vtzero:
      ext: Zvtbase
      fixed: {"31..26": 0x10, "25": 1, "24..20": 0x1E, "19..15": 0, "14..12": 6, "7": 0, "6..0": 0x57}
      operands: {mtd: [8, 11]}
    vtdiscard:
      ext: Zvtbase
      fixed: {"31..26": 0x10, "25": 1, "24..20": 0x1C, "19..15": 0, "14..12": 6, "11..7": 0, "6..0": 0x57}
      operands: {}
    vtfmm.tvv:
      ext: [Zvtofp8fmm, Zvtfp16fmm, Zvtfmm, Zvtdmm]
      fixed: {"31..26": 0x3C, "25": 1, "14..12": 1, "8..7": 0, "6..0": 0x77}
      operands: {vs2: [20, 24], vs1: [15, 19], mtd: [9, 11]}
    vtfmm.alt.tvv:
      ext: [Zvtofp8fmm, Zvtbf16fmm]
      fixed: {"31..26": 0x3C, "25": 1, "14..12": 1, "8..7": 1, "6..0": 0x77}
      operands: {vs2: [20, 24], vs1: [15, 19], mtd: [9, 11]}
    vtmmu.tvv:
      ext: Zvti8i32mm
      fixed: {"31..26": 0x3C, "25": 1, "14..12": 0, "8..7": 0, "6..0": 0x77}
      operands: {vs2: [20, 24], vs1: [15, 19], mtd: [9, 11]}
    vtmms.tvv:
      ext: Zvti8i32mm
      fixed: {"31..26": 0x3C, "25": 1, "14..12": 0, "8..7": 1, "6..0": 0x77}
      operands: {vs2: [20, 24], vs1: [15, 19], mtd: [9, 11]}
