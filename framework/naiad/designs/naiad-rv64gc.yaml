# naiad-fp-rv64 plus the compressed ISA: rv64imafdc_zicsr_zicntr (rv64gc), lp64d,
# so stock rv64gc binaries run. Same memory map as naiad-base.yaml.
name: naiad-rv64gc
cores:
  count: 1
  xlen: 64
  isa: [i, m, a, f, d, c, zicsr, zicntr]
  reset_pc: 0x1000
program:
  memory: dram
  stack_size: 64KiB
blocks:
  - {name: bootrom, type: bootrom, base: 0x1000, window: 0x1000}
  - {name: clint, type: clint, base: 0x02000000, window: 0x10000}
  - name: perf
    type: perfcounters
    base: 0x02010000
    window: 0x1000
    params: {counters: [cycle, instret, mtime, htif_chars]}
  - {name: dram, type: dram, base: 0x80000000, window: 1GiB}
  - {name: htif, type: htif}
